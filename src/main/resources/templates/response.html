<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>RPC Response</title>
  </head>
  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="p-6 bg-white rounded-lg shadow-md">
      <h1 class="text-2xl font-bold mb-4 font-mono hover:text-blue-500">
        RPC Server Response
      </h1>
      <p class="text-gray-700 text-xl mb-4 font-bold font-mono">
        Response from server:
      </p>
      <div class="bg-gray-50 p-4 rounded-lg text-gray-900 text-base gap-1">
        <span class="font-mono text-lg">
          <strong class="text-blue-500 font-mono" th:text="${response}"
            >Your response will appear here</strong
          >
        </span>
      </div>
      <a
        href="/"
        class="mt-6 inline-block text-blue-500 hover:underline font-mono"
      >
        Go back to Home
      </a>
    </div>
  </body>
</html>
