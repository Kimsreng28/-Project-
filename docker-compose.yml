version: "3.9"
services:
  postgres-master:
    image: postgres:16
    container_name: postgres-master
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/master/init.sql:/docker-entrypoint-initdb.d/init.sql

  postgres-slave:
    image: postgres:16
    container_name: postgres-slave
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    depends_on:
      - postgres-master
    volumes:
      - ./postgres/slave/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      bash -c "
      until ping -c1 postgres-master; do sleep 1; done;
      until pg_isready -h postgres-master; do sleep 1; done;
      pg_basebackup -h postgres-master -D /var/lib/postgresql/data -U admin -Fp -Xs -R -C;
      postgres"

  pgpool:
    image: bitnami/pgpool:4
    container_name: pgpool
    environment:
      - PGPOOL_BACKEND_NODES=0:postgres-master:5432,1:postgres-slave:5432
      - PGPOOL_SR_CHECK_USER=admin
      - PGPOOL_SR_CHECK_PASSWORD=password
    ports:
      - "5434:5432"
    depends_on:
      - postgres-master
      - postgres-slave
    volumes:
      - ./pgpool/pgpool.conf:/opt/bitnami/pgpool/conf/pgpool.conf
      - ./pgpool/pcp.conf:/opt/bitnami/pgpool/conf/pcp.conf
      - ./pgpool/pool_hba.conf:/opt/bitnami/pgpool/conf/pool_hba.conf
