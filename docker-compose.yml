version: "3.8"
services:
  postgres-primary:
    build: ./postgres-primary
    environment:
      - DB_REP_USER=replicator
      - DB_REP_PASS=securepassword
    networks:
      - pg-network

  pgpool:
    build: ./pgpool
    depends_on:
      - postgres-primary
      - postgres-replica
    links:
      - postgres-primary
      - postgres-replica
    volumes:
      - ./pgpool/pgpool.conf:/etc/pgpool2/pgpool.conf
    networks:
      - pg-network

  postgres-replica:
    build: ./postgres-replica
    environment:
      - PRIMARY_DB_HOST=postgres-primary
      - PRIMARY_DB_PORT=5432
      - PRIMARY_DB_REP_USER=replicator
      - PRIMARY_DB_REP_PASS=securepassword
    networks:
      - pg-network

networks:
  pg-network:
    driver: bridge
